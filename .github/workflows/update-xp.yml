name: Update XP Scoreboard

on:
  push:
    paths:
      - "Week-*/week-*.md"

jobs:
  update-xp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run XP update script
        run: python XP-tracker/update_xp.py 7

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Auto-update XP scoreboard"
          git push
